<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AURA CODE</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AURA CODE">
  <meta name="theme-color" content="#121417">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://w3.org' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23121417'/><circle cx='50' cy='50' r='30' fill='none' stroke='%23e6d2b5' stroke-width='3'/></svg>">
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { margin: 0; padding: 16px 16px 40px; background: #121417; color: #f0f0f0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    h1 { font-size: 17px; letter-spacing: 3px; font-weight: 500; color: #e6d2b5; margin: 8px 0 16px; }
    .controls { width: 100%; max-width: 340px; background: #1c1f24; padding: 16px; border-radius: 16px; display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px; border: 1px solid #2a2e35; }
    label { font-size: 12px; color: #9ca3af; margin-bottom: 4px; display: block; }
    input, select { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #374151; background: #121417; color: #fff; font-size: 15px; outline: none; }
    .btn-group { display: flex; gap: 8px; margin-top: 4px; }
    button { flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn-gen { background: #e6d2b5; color: #121417; }
    .btn-save { background: #2a2e35; color: #e6d2b5; border: 1px solid #e6d2b5; }
    #preview-wrapper { width: 260px; height: 462px; border-radius: 20px; overflow: hidden; box-shadow: 0 15px 40px rgba(0,0,0,0.6); transition: opacity 0.2s; }
    svg { width: 100%; height: 100%; display: block; }
    .info-badge { margin-top: 12px; font-size: 12px; color: #9ca3af; text-align: center; line-height: 1.5; }
    .toast { font-size: 12px; color: #e6d2b5; height: 18px; margin-top: 4px; text-align: center; }
    #save-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 999; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    #save-modal img { max-height: 72vh; border-radius: 16px; border: 1px solid #374151; }
    #save-modal p { color: #e6d2b5; font-size: 14px; margin: 14px 0; text-align: center; }
    #save-modal button { flex: none; padding: 10px 28px; background: #374151; color: #fff; }
  </style>
</head>
<body>
  <h1>AURA CODE</h1>
  <div class="controls">
    <div><label>ชื่อของคุณ</label><input type="text" id="userName" value="PLAS"></div>
    <div><label>วันเดือนปีเกิด (ค.ศ.)</label><input type="date" id="birthDate" value="1988-11-28"></div>
    <div>
      <label>รูปแบบพลังงานเฉพาะตัว</label>
      <select id="patternStyle">
        <option value="cymatics">1. เรขาคณิตศักดิ์สิทธิ์ (Cymatics)</option>
        <option value="soundwave">2. กราฟคลื่นเสียง (Soundwave)</option>
        <option value="topo">3. เส้นภูมิประเทศ (Topographic)</option>
      </select>
    </div>
    <div class="btn-group">
      <button type="button" class="btn-gen" onclick="handleGenerate()">สร้างภาพ</button>
      <button type="button" class="btn-save" onclick="openSaveModal()">บันทึกรูป</button>
    </div>
    <div class="toast" id="toastMsg"></div>
  </div>
  <div id="preview-wrapper"><svg id="wallpaper-svg" viewBox="0 0 1080 1920" xmlns="http://w3.org"></svg></div>
  <div class="info-badge" id="energy-info"></div>
  <div id="save-modal">
    <img id="exported-img" alt="Wallpaper">
    <p>แตะค้างที่รูปภาพด้านบน แล้วเลือก <b>"บันทึกลงแอปรูปภาพ"</b></p>
    <button type="button" onclick="document.getElementById('save-modal').style.display='none'">ปิดหน้าต่าง</button>
  </div>
  <script>
    const taksaPalettes = [
      { day: "วันอาทิตย์", c1: "#6b8279", c2: "#3d524a", c3: "#24332d", desc: "โทนเขียวเสจ (เดช) • ตัดสีฟ้ากาลกิณี" },
      { day: "วันจันทร์", c1: "#8ea395", c2: "#5d736e", c3: "#354856", desc: "โทนเขียวเสจ-คราม (เดช/มนตรี) • ตัดสีแดงกาลกิณี" },
      { day: "วันอังคาร", c1: "#7b6d8d", c2: "#524863", c3: "#2f2a3b", desc: "โทนม่วงหม่น (ศรี) • ตัดสีขาว/เหลืองกาลกิณี" },
      { day: "วันพุธ", c1: "#5c7a67", c2: "#3e5949", c3: "#23362b", desc: "โทนเขียวมรกตหม่น (บริวาร/เดช) • ตัดสีชมพูกาลกิณี" },
      { day: "วันพฤหัสบดี", c1: "#536b88", c2: "#384b63", c3: "#1f2b3b", desc: "โทนฟ้าคราม (ศรี) • ตัดสีม่วง/ดำกาลกิณี" },
      { day: "วันศุกร์", c1: "#7592a8", c2: "#526c82", c3: "#314454", desc: "โทนฟ้าหม่น (บริวาร/มนตรี) • ตัดสีเทาดำกาลกิณี" },
      { day: "วันเสาร์", c1: "#3c4c6e", c2: "#28334d", c3: "#171e2e", desc: "โทนน้ำเงินเข้ม (ศรี) • ตัดสีเขียวกาลกิณี" }
    ];

    function getSeed(name, dateStr) {
      const str = `${name.trim().toLowerCase()}|${dateStr.trim()}`;
      let nums = [], h = 2166136261;
      for (let i = 0; i < 64; i++) {
        for (let j = 0; j < str.length; j++) {
          h = Math.imul(h ^ (str.charCodeAt(j) + i), 16777619);
        }
        nums.push(Math.abs(h) % 256);
      }
      return nums;
    }

    function handleGenerate() {
      const w = document.getElementById('preview-wrapper');
      const t = document.getElementById('toastMsg');
      w.style.opacity = '0.3';
      t.innerText = 'กำลังคำนวณ...';
      setTimeout(() => {
        renderWallpaper();
        w.style.opacity = '1';
        t.innerText = '✓ สร้างภาพเฉพาะตัวสำเร็จ';
        setTimeout(() => { t.innerText = ''; }, 2000);
      }, 150);
    }

    function renderWallpaper() {
      const name = document.getElementById('userName').value || "PLAS";
      const dateVal = document.getElementById('birthDate').value || "1988-11-28";
      const style = document.getElementById('patternStyle').value;
      const p = dateVal.split('-');
      const d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
      const pal = taksaPalettes[isNaN(d.getDay()) ? 1 : d.getDay()];
      const seed = getSeed(name, dateVal);

      document.getElementById('energy-info').innerHTML = `<b>${pal.day}</b><br>${pal.desc}`;
      const svg = document.getElementById('wallpaper-svg');
      const cx = 540, cy = 960, gold = "#e6d2b5";
      let out = `<defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="${pal.c1}"/><stop offset="50%" stop-color="${pal.c2}"/><stop offset="100%" stop-color="${pal.c3}"/></linearGradient></defs><rect width="1080" height="1920" fill="url(#bg)"/>`;

      if (style === 'cymatics') {
        const petals = 6 + (seed[0] % 7), rad = 150 + (seed[1] % 100), wave = 45 + (seed[2] % 80), rot = seed[3] % 360;
        out += `<g transform="rotate(${rot} ${cx} ${cy})">`;
        for (let i = 0; i < 4; i++) {
          const r = rad + (i * 65) + (seed[i + 4] % 30);
          const dash = (seed[i + 8] % 2 === 0) ? `stroke-dasharray="${6 + (seed[i] % 12)} ${12 + (seed[i+1] % 18)}"` : "";
          out += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${gold}" stroke-width="${i === 0 ? 3.5 : 1.8}" stroke-opacity="${0.45 + (i * 0.1)}" ${dash}/>`;
        }
        for (let s = 0; s < petals; s++) {
          out += `<ellipse cx="${cx}" cy="${cy - (rad * 0.6)}" rx="${wave}" ry="${rad * 0.85}" fill="none" stroke="${gold}" stroke-width="2.2" stroke-opacity="0.7" transform="rotate(${(360 / petals) * s} ${cx} ${cy})"/>`;
        }
        out += `</g>`;
      } else if (style === 'soundwave') {
        const count = 48, bw = 6, gap = 8, startX = (1080 - count * (bw + gap)) / 2;
        for (let i = 0; i < count; i++) {
          const env = Math.cos((Math.abs(i - count / 2) / (count / 2)) * (Math.PI / 2));
          const bh = Math.max(16, (40 + (seed[i % 64] * 1.4)) * env);
          out += `<rect x="${startX + i * (bw + gap)}" y="${cy - bh / 2}" width="${bw}" height="${bh}" rx="3" fill="${gold}" fill-opacity="${0.45 + env * 0.45}"/>`;
        }
      } else if (style === 'topo') {
        const ox = ((seed[0] % 100) - 50) * 1.5, oy = ((seed[1] % 100) - 50) * 1.5;
        for (let r = 1; r <= 9; r++) {
          let path = "";
          for (let pt = 0; pt <= 36; pt++) {
            const th = (pt / 36) * Math.PI * 2;
            const cr = (r * 55) + Math.sin(th * (2 + (seed[2] % 4)) + (seed[3] * 0.1)) * (15 + (seed[r] % 25));
            path += `${pt === 0 ? 'M' : 'L'} ${(cx + ox) + Math.cos(th) * cr} ${(cy + oy) + Math.sin(th) * cr * 1.3} `;
          }
          out += `<path d="${path}Z" fill="none" stroke="${gold}" stroke-width="${r % 3 === 0 ? 2.5 : 1.2}" stroke-opacity="${0.35 + r * 0.05}"/>`;
        }
      }
      svg.innerHTML = out;
    }

    function openSaveModal() {
      const svgData = new XMLSerializer().serializeToString(document.getElementById('wallpaper-svg'));
      const canvas = document.createElement("canvas");
      canvas.width = 1080; canvas.height = 1920;
      const img = new Image();
      img.onload = () => {
        canvas.getContext("2d").drawImage(img, 0, 0);
        document.getElementById('exported-img').src = canvas.toDataURL("image/png");
        document.getElementById('save-modal').style.display = 'flex';
      };
      img.src = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svgData)));
    }

    window.onload = renderWallpaper;
  </script>
</body>
</html>
